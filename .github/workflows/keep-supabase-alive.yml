name: Keep Supabase Alive (principal-booking)

# Supabase無料プランは7日間データベースへの実アクセスがないと自動停止する。
# クライアントへの実績デモとして常時見せられる状態を保つため、
# 週2回、軽量な確認用関数(keep_alive)を呼び出してアクティビティを発生させる。
# サブPCの稼働状況とは無関係に、GitHubのクラウド上で確実に実行される。

on:
  schedule:
    # 毎週月曜・木曜 12:00 JST (03:00 UTC) に実行
    - cron: '0 3 * * 1,4'
  workflow_dispatch: # 手動実行もできるようにしておく

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep_alive function
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          echo "Response status: $response"
          if [ "$response" -ge 400 ]; then
            echo "::error::keep_alive呼び出しが失敗しました (status: $response)"
            exit 1
          fi
